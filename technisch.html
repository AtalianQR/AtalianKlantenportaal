<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATALIAN — Technisch onderhoud</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .site-tabs { display:flex; gap:4px; margin-bottom:16px; }
    .site-tab  { padding:7px 16px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid var(--color-border); background:#f9fafb; color:var(--color-text-2); transition:all .15s; }
    .site-tab.active { background:var(--color-accent); color:#fff; border-color:var(--color-accent); }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <span class="logo"></span>
      <span class="client-selector">Vlaeminck Logistics ▾</span>
      <div class="topbar-actions"><span>🔔</span><span>DS ▾</span></div>
    </header>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title" data-i18n="technical.title">Technisch onderhoud</h1>
        <p class="page-desc" data-i18n="technical.subtitle">Overzicht gepland vs. uitgevoerd technisch onderhoud — lopend jaar 2026, per site.</p>
      </div>

      <div class="site-tabs">
        <div class="site-tab active" data-site="alle" data-i18n="technical.tab.all">Alle sites</div>
        <div class="site-tab" data-site="gent">Gent</div>
        <div class="site-tab" data-site="antwerpen">Antwerpen</div>
        <div class="site-tab" data-site="brussel">Brussel</div>
      </div>

      <div class="kpi-row" id="kpi-row"></div>

      <div class="card" style="margin-top:8px">
        <div class="card-title" id="chart-title">Gepland vs. uitgevoerd — 2026 per maand (alle sites)</div>
        <div style="position:relative;height:280px;margin-top:12px">
          <canvas id="chart-technisch"></canvas>
        </div>
        <div style="display:flex;gap:20px;margin-top:12px;font-size:12px;color:var(--color-text-2)">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:2px;background:#74AE25;display:inline-block"></span><span data-i18n="technical.legend.done">Uitgevoerd</span></span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:2px;background:#D93025;display:inline-block"></span><span data-i18n="technical.legend.notDone">Niet uitgevoerd</span></span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:12px;height:12px;border-radius:2px;background:rgba(74,144,217,.35);border:1px solid #4A90D9;display:inline-block"></span><span data-i18n="technical.legend.planned">Gepland (toekomst)</span></span>
        </div>
      </div>

    </main>
  </div>
  <script src="i18n-dict.js"></script>
  <script src="i18n.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="feedback.js"></script>
  <script>
    var MAANDEN = {
      nl: ['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'],
      fr: ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'],
      en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
    };
    var TXT = {
      done:        { nl: 'UITGEVOERD',                fr: 'RÉALISÉ',              en: 'COMPLETED' },
      doneTrend:   { nl: 't.e.m. mei 2026',           fr: "jusqu'à mai 2026",      en: 'through May 2026' },
      planned:     { nl: 'GEPLAND (volledig jaar)',   fr: 'PLANIFIÉ (année complète)', en: 'PLANNED (full year)' },
      plannedTrend:{ nl: 'jan – dec 2026',            fr: 'jan – déc 2026',        en: 'Jan – Dec 2026' },
      remaining:   { nl: 'RESTEREND JAAR',            fr: "RESTANT DE L'ANNÉE",    en: 'REMAINING THIS YEAR' },
      remainingTrend: { nl: 'jun – dec 2026',         fr: 'juin – déc 2026',       en: 'Jun – Dec 2026' },
      notDone:     { nl: 'NIET UITGEVOERD',           fr: 'NON RÉALISÉ',           en: 'NOT COMPLETED' },
      notDoneTrend:{ nl: 'inhaalbeurt vereist',       fr: 'rattrapage requis',     en: 'catch-up required' },
      chartTitle:  { nl: 'Gepland vs. uitgevoerd — 2026 per maand',  fr: 'Planifié vs. réalisé — 2026 par mois', en: 'Planned vs. completed — 2026 per month' },
      allSites:    { nl: 'alle sites', fr: 'tous les sites', en: 'all sites' }
    };
    var huidigeMaand = new Date().getMonth();

    var DATA = {
      alle:      { gepland:[8,8,8,8,8,8,8,8,8,8,8,8], uitgevoerd:[8,7,8,8,7,0,0,0,0,0,0,0] },
      gent:      { gepland:[3,3,3,3,3,3,3,3,3,3,3,3], uitgevoerd:[3,3,3,3,3,0,0,0,0,0,0,0] },
      antwerpen: { gepland:[3,3,3,3,3,3,3,3,3,3,3,3], uitgevoerd:[3,2,3,3,2,0,0,0,0,0,0,0] },
      brussel:   { gepland:[2,2,2,2,2,2,2,2,2,2,2,2], uitgevoerd:[2,2,2,2,2,0,0,0,0,0,0,0] }
    };

    function getLang() {
      var l = localStorage.getItem('lang');
      return ['nl','fr','en'].indexOf(l) !== -1 ? l : 'nl';
    }

    function siteLabel(key, lang) {
      if (key === 'alle') return TXT.allSites[lang];
      return key.charAt(0).toUpperCase() + key.slice(1);
    }

    function kpiHtml(d, lang) {
      var uitg = d.uitgevoerd.reduce(function(a,b){return a+b;},0);
      var totaal = d.gepland.reduce(function(a,b){return a+b;},0);
      var gemist = d.gepland.slice(0, huidigeMaand+1).reduce(function(a,g,i){return a+Math.max(0,g-d.uitgevoerd[i]);},0);
      var resterend = totaal - uitg - gemist;
      return '<div class="kpi-card kpi-success"><div class="kpi-label-top">' + TXT.done[lang] + '</div><div class="kpi-value">' + uitg + '</div><div class="kpi-trend trend-up">' + TXT.doneTrend[lang] + '</div></div>' +
        '<div class="kpi-card"><div class="kpi-label-top">' + TXT.planned[lang] + '</div><div class="kpi-value">' + totaal + '</div><div class="kpi-trend trend-neutral">' + TXT.plannedTrend[lang] + '</div></div>' +
        '<div class="kpi-card kpi-warning"><div class="kpi-label-top">' + TXT.remaining[lang] + '</div><div class="kpi-value">' + resterend + '</div><div class="kpi-trend trend-neutral">' + TXT.remainingTrend[lang] + '</div></div>' +
        '<div class="kpi-card kpi-danger"><div class="kpi-label-top">' + TXT.notDone[lang] + '</div><div class="kpi-value">' + gemist + '</div><div class="kpi-trend trend-alert">' + TXT.notDoneTrend[lang] + '</div></div>';
    }

    var ctx = document.getElementById('chart-technisch').getContext('2d');
    var chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: MAANDEN[getLang()], datasets: [] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { mode: 'index' } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 11 } } },
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: '#f0f2f5' } }
        }
      }
    });

    var currentSite = 'alle';

    function update(key) {
      currentSite = key;
      var lang = getLang();
      var d = DATA[key];
      document.getElementById('kpi-row').innerHTML = kpiHtml(d, lang);
      document.getElementById('chart-title').textContent = TXT.chartTitle[lang] + ' (' + siteLabel(key, lang) + ')';
      chart.data.labels = MAANDEN[lang];
      var gemist = d.gepland.map(function(g,i){ return i <= huidigeMaand && d.uitgevoerd[i] < g ? g - d.uitgevoerd[i] : 0; });
      chart.data.datasets = [
        {
          label: TXT.done[lang],
          data: d.uitgevoerd,
          backgroundColor: '#74AE25',
          borderRadius: 4
        },
        {
          label: TXT.notDone[lang],
          data: gemist,
          backgroundColor: '#D93025',
          borderRadius: 4
        },
        {
          label: TXT.planned[lang],
          data: d.gepland.map(function(g,i){ return i > huidigeMaand ? g : 0; }),
          backgroundColor: 'rgba(74,144,217,.35)',
          borderColor: '#4A90D9',
          borderWidth: 1,
          borderRadius: 4
        }
      ];
      chart.options.scales.y.max = Math.max.apply(null, d.gepland) + 1;
      chart.update();
    }

    document.querySelectorAll('.site-tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.site-tab').forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        update(tab.dataset.site);
      });
    });

    update('alle');
    document.addEventListener('langchange', function () { update(currentSite); });
  </script>
</body>
</html>
